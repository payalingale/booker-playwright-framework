[pytest]
testpaths= tests
addopts = --strict-markers
markers = smoke: critical-path tests, run on every push
    regression: full regression suite
filterwarnings = ignore:Session-scoped fixtures defined as instance methods
log_file = logs/test-run.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_file_date_format = %H:%M:%S